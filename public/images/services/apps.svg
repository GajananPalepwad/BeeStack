<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="appsGrad" x1="6" y1="8" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="appsAccent" x1="24" y1="4" x2="24" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="appsGlow" x="0" y="0" width="48" height="48" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06B6D4" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Desktop Browser / SaaS Window -->
  <rect x="6" y="8" width="30" height="22" rx="3" fill="url(#appsGrad)" filter="url(#appsGlow)" />
  <rect x="6" y="8" width="30" height="6" fill="#164E63" />
  <circle cx="10" cy="11" r="1.3" fill="#F87171" />
  <circle cx="14" cy="11" r="1.3" fill="#FBBF24" />
  <circle cx="18" cy="11" r="1.3" fill="#34D399" />

  <!-- Code brackets inside browser window -->
  <path d="M14 20L11 22.5L14 25" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M22 20L25 22.5L22 25" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="19" y1="19" x2="17" y2="26" stroke="#67E8F9" stroke-width="1.8" stroke-linecap="round" />

  <!-- Mobile Phone Overlay (Cross-Platform / Responsive) -->
  <rect x="24" y="16" width="18" height="27" rx="3.5" fill="url(#appsAccent)" stroke="#164E63" stroke-width="1.5" />
  <rect x="27" y="20" width="12" height="18" rx="1.5" fill="#ECFEFF" />
  <line x1="30" y1="18" x2="36" y2="18" stroke="#164E63" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="33" cy="40.5" r="1" fill="#164E63" />

  <!-- Cloud / API Sync Arrow -->
  <path d="M30 25L33 22L36 25" stroke="#0891B2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="33" y1="22" x2="33" y2="30" stroke="#0891B2" stroke-width="1.8" stroke-linecap="round" />

  <!-- Sparkle -->
  <path d="M40 7L40.7 8.8L42.5 9.5L40.7 10.2L40 12L39.3 10.2L37.5 9.5L39.3 8.8L40 7Z" fill="#FDE047" />
</svg>
