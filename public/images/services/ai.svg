  <line x1="35" y1="24" x2="42" y2="24" stroke="url(#aiAccent)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="35" y1="30" x2="41" y2="30" stroke="url(#aiAccent)" stroke-width="2.2" stroke-linecap="round" />

  <!-- Central Intelligence Pulse -->
  <circle cx="24" cy="24" r="3.5" fill="#C4B5FD" />
  <path d="M21 24H27" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
  <path d="M24 21V27" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />

