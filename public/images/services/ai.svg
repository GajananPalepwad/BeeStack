  <line x1="18" y1="7" x2="18" y2="13" stroke="url(#aiAccent)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="24" y1="6" x2="24" y2="13" stroke="url(#aiAccent)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="30" y1="7" x2="30" y2="13" stroke="url(#aiAccent)" stroke-width="2.2" stroke-linecap="round" />

  <line x1="18" y1="35" x2="18" y2="41" stroke="url(#aiAccent)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="24" y1="35" x2="24" y2="42" stroke="url(#aiAccent)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="30" y1="35" x2="30" y2="41" stroke="url(#aiAccent)" stroke-width="2.2" stroke-linecap="round" />

  <line x1="7" y1="18" x2="13" y2="18" stroke="url(#aiAccent)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="6" y1="24" x2="13" y2="24" stroke="url(#aiAccent)" stroke-width="2.2" stroke-linecap="round" />
