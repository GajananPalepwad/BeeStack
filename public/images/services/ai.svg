<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="aiGrad" x1="6" y1="8" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="aiAccent" x1="24" y1="4" x2="24" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="aiGlow" x="0" y="0" width="48" height="48" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8B5CF6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Central Neural AI Processor Chip -->
  <rect x="13" y="13" width="22" height="22" rx="4.5" fill="url(#aiGrad)" filter="url(#aiGlow)" />
  <rect x="17" y="17" width="14" height="14" rx="2" fill="#2E1065" />

