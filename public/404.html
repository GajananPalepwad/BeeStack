<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Page Not Found | BeeStack Software Labs</title>
  <meta name="description" content="The page you are looking for does not exist or has been moved. Explore BeeStack's software solutions and digital products.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=K2D:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'K2D', system-ui, -apple-system, sans-serif;
      background-color: #070B12;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }
    /* Subtle background ambient glow */
    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(252, 171, 30, 0.12) 0%, rgba(16, 185, 129, 0.05) 50%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(60px);
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 100%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 44px 36px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      margin-bottom: 24px;
    }
    .brand img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }
    .brand-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.01em;
    }
    .brand-sub {
      display: block;
      font-size: 0.65rem;
      font-weight: 800;
      color: #FCAB1E;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: left;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.28);
      color: #F87171;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #EF4444;
      box-shadow: 0 0 8px #EF4444;
    }
    .code {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
      color: #FFFFFF;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      background: linear-gradient(180deg, #FFFFFF 0%, #94A3B8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #F8FAFC;
      margin-bottom: 12px;
    }
    .desc {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #94A3B8;
      margin-bottom: 28px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (min-width: 480px) {
      .actions {
        flex-direction: row;
        justify-content: center;
      }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.22s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: #FCAB1E;
      color: #070B12;
      box-shadow: 0 4px 16px rgba(252, 171, 30, 0.35);
    }
    .btn-primary:hover {
      background: #F59E0B;
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(252, 171, 30, 0.45);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #F8FAFC;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
    .links-title {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.8rem;
      color: #64748B;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }
    .links-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 16px;
    }
    .quick-link {
      color: #FCAB1E;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      transition: color 0.15s ease;
    }
    .quick-link:hover {
      color: #FCD34D;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <main class="card">
    <a href="/" class="brand" aria-label="BeeStack Home">
      <img src="/logo.png" alt="BeeStack Mascot">
      <div>
        <span class="brand-title">BeeStack</span>
        <span class="brand-sub">SOFTWARE LABS</span>
      </div>
    </a>

    <div>
      <span class="badge">
        <span class="badge-dot"></span>
        HTTP 404 • Not Found
      </span>
    </div>

    <div class="code">404</div>
    <h1 class="title">Lost in the Hive?</h1>
    <p class="desc">
      The page you requested doesn't exist, has been relocated, or never existed in our directory.
    </p>

    <div class="actions">
      <a href="/" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        Return to Home
      </a>
      <a href="/our-work/products" class="btn btn-secondary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
        </svg>
        Explore Our Work
      </a>
    </div>

    <div class="links-title">Quick Navigation</div>
    <div class="links-row">
      <a href="/our-work/products" class="quick-link">Products</a>
      <a href="/about-us" class="quick-link">About Us</a>
      <a href="/careers/current-openings" class="quick-link">Careers</a>
      <a href="/contact-us" class="quick-link">Contact Us</a>
    </div>
  </main>
</body>
</html>
